# USB device identity of the vanilla baseline, read by the gadget setup (common/shared/net-up) in
# BOTH the recovery initramfs and the rootfs, and shared with the C2Air baseline. POSIX sh syntax,
# installed as /etc/baseline/usb-ids.conf. Changing identity is a change to this one file.
#
# VID 0x1314 is assigned by the USB-IF to the original vendor (Carlinkit). We reuse it ONLY for
# compatibility with the existing host apps and shared tooling, which filter on it. The clean
# alternative is a pid.codes allocation under VID 0x1209; switching is a one-file change here.
#
# NCM (default mode): 0x1314:0x1520. Evidence: ccpa/rootfs/script/ocbm_boot.sh:44-47 ("stock/NCM is
# 0x1520"), docs/carplay/00_ARCHITECTURE.md:355 ("0x1521 on some SKUs"), and on-box sysfs reads of
# the NCM CFW gadget on the IW416 unit (scratchpad/ocbm_2026090*/trial.txt line 4:
# "class=239 sub=2 proto=1 pid=1520 functions=ncm"). The stock riddle_default.conf lists
# USBPID 1521 (CPC200-CCPA_resources/custom/docs/README.md:366-367); that is the vendor default
# config, not what the NCM CFW gadget was read enumerating.
# CONSEQUENCE: every host that filters 0x1314:0x1520 matches this NCM gadget, including apps that
# speak the Carlinkit protocol (carlink_native filters 0x1520/0x1521; the macOS app lists 0x1520 as
# "legacy", host/MacHost/carlink_macOS/USB/USBDeviceManager.swift:53-55). The stock NCM CFW had the
# same identity, so this is no regression; how those apps behave against a pure NCM function is
# UNVERIFIED.
USB_VID=0x1314
USB_NCM_PID=0x1520
# Device class of the stock NCM CFW gadget (239/2/1 = IAD composite), from the same trial.txt read.
USB_NCM_CLASS=0xef
USB_NCM_SUBCLASS=0x02
USB_NCM_PROTOCOL=0x01

# OCBM function mode (FunctionFS, needs ocbmd; NOT part of the baseline, listed so that switching
# modes only changes the PID and the function): ccpa/rootfs/script/ocbm_boot.sh:51.
USB_OCBM_PID=0x2d00

# ACM debug shell mode (recovery only, unauthenticated). No Carlinkit PID is assigned to it, so it
# uses the Linux Foundation "multifunction composite gadget" ID that no host app filters on.
USB_ACM_VID=0x1d6b
USB_ACM_PID=0x0104

# Strings of the stock g_android_accessory defaults, which the OCBM host apps already match
# (USBDeviceManager.swift, host/ocbm-host/src/main.rs, gm_ccpa device_filter.xml).
USB_MANUFACTURER="Magic Communication Tec."
USB_PRODUCT="Auto Box"
# iSerial is NOT configured here: common/shared/ocbm-identity derives "OCBM-" + 12 hex of
# sha256(chip ID) per unit. If it cannot (no OCOTP), net-up falls back to this placeholder.
USB_SERIAL_FALLBACK="OCBM-unidentified"

# NOT in the baseline (OCBM-phase item, provenance UNVERIFIED): the phone-facing iPhone gadget in
# tools/projection_up.sh:49-50 uses VID 0x08e4 PID 0x01c0 with the same two strings.
