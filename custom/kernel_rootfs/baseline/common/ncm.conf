# NCM link addressing, installed as /etc/baseline/ncm.conf and read by common/shared/net-up.
# 192.168.50.2/24 with the host at 192.168.50.100 is the old CCPA CFW's plan
# (ccpa/rootfs/script/custom_init.sh:59-68) and avoids 10.10.10.1, which LIVI and the C2Air use.
NCM_DEV_IP=192.168.50.2
NCM_NETMASK=255.255.255.0
# udhcpd pool of exactly one address. The host-side MAC is fixed per unit (host_addr from
# ocbm-identity), so the host gets the same lease on every boot. Short lease: a second client id
# (another host, a VM) waits at most this long for the slot.
NCM_HOST_IP=192.168.50.100
NCM_LEASE=600
