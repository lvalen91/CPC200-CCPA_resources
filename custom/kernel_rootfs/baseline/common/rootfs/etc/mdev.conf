# busybox mdev (started as `mdev -d` by rcS). Two rules, first match wins:
#   - a whole SCSI disk (a USB stick here): run usb-mount on add and remove (ACTION, MDEV=sdX);
#   - everything else: nothing.
# "!" on both: mdev neither creates, chmods nor unlinks a node (devtmpfs owns /dev; without it mdev's
# default rule would chmod every node to 0660, /dev/null included). There is deliberately NO
# "$MODALIAS=..." line: mdev loads modules only through such a rule, so it never loads a radio driver
# or the MMC host (radio-up does that on demand).
sd[a-z] 0:0 0660 ! */usr/sbin/usb-mount --mdev
.* 0:0 0660 !
